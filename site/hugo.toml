baseURL = "https://example.invalid/"
locale = "en-US"
title = "Catalog"
theme = "hackyfeed-theme"
timeZone = "UTC"

[params]
  description = "A generated GitHub tools catalog. Run hackyfeed generate to apply project branding."
  author = ""
  tagline = "> catalog"
  rssLimit = 50

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[outputFormats.RSS]
  mediatype = "application/rss+xml"
  baseName = "feed"

[markup.goldmark.renderer]
  unsafe = false

[services.rss]
  limit = 50

[pagination]
  pagerSize = 25
